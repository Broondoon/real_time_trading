# ===================== pgpool-II Configuration =====================

# Listen on all network interfaces
listen_addresses = '*'
port = 6432
socket_dir = '/tmp'

# Logging settings
log_destination = 'stderr'
log_line_prefix = '%t: pid %p: '
log_connections = on
log_disconnections = on
log_statement = 'none'

# ===================== Backend Node Configuration =====================

# Primary node configuration (writes)
backend_hostname0 = 'user-management-db'
backend_port0 = 5432
backend_weight0 = 1
# I don't think we care about failover at this time
# backend_flag0 = 'ALLOW_TO_FAILOVER'

# Replica node configuration (reads)
backend_hostname1 = 'user-management-db-replica-1'
backend_port1 = 5432
backend_weight1 = 1
#backend_flag1 = 'ALLOW_TO_FAILOVER'

# ===================== Load Balancing Settings =====================

# Enable load balancing of read-only queries.
load_balance_mode = on

# Disable load balancing for queries that modify data.
disable_load_balance_on_write = on

# Use streaming replication mode (as opposed to built-in replication mode)
replication_mode = off

# ===================== Connection Pooling Settings =====================

num_init_children = 32
max_pool = 4
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# ===================== Health Check Settings (Optional) =====================

health_check_period = 10
health_check_timeout = 20
health_check_user = 'user_management'  # Replace with your actual PostgreSQL user for health checks

# =====================================================================

